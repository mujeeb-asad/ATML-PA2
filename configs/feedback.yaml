base_config: configs/base.yaml
results_dir: results
safety_max_new_tokens: 256
math_max_new_tokens: 512
judge_max_new_tokens: 64
judge_temperature: 0.0
manual_audit_per_class: 30
policies:
  sft: null
  dpo: outputs/task1_dpo/standard
  ppo: outputs/task2_ppo/standard
  grpo: outputs/task3_grpo/standard
  rlvr: checkpoints/rlvr_policy
  rlaif: checkpoints/rlaif_policy

# added for the task 4 generation script
safety_batch_size: 16     # prompts per generation batch, the same for all four policies

# added for the task 5 evaluation scripts
math_batch_size: 16       # prompts per generation batch, the same for all three policies
math_max_prompt_length: 512  # longest gsm8k / svamp prompt is well under this, so no problem text is ever cut
